<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 330" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1976D2" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F57C00" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7B1FA2" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1140" height="330" fill="#FFFFFF" rx="8" />

  <!-- Node 1: Input -->
  <g filter="url(#shadow)">
    <rect x="25" y="115" width="205" height="90" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="127" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0D47A1" text-anchor="middle">Analog Voltage Input</text>
    <text x="127" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1565C0" text-anchor="middle">Potentiometer</text>
    <text x="127" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1976D2" text-anchor="middle">(Range: 0V - 5V)</text>
  </g>

  <!-- Arrow 1: Input to MCU -->
  <path d="M 230 160 L 283 160" fill="none" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="257" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#1976D2" text-anchor="middle">Pin PA0</text>

  <!-- Node 2: MCU -->
  <g filter="url(#shadow)">
    <rect x="290" y="100" width="225" height="120" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" />
    <text x="402" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">ATmega32 MCU</text>
    <text x="402" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#EF6C00" text-anchor="middle">10-bit ADC Converter</text>
    <text x="402" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#E65100" text-anchor="middle">Digital Value: 0 - 1023</text>
    <text x="402" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#F57C00" text-anchor="middle">Vref: AREF / AVCC / 2.56V</text>
  </g>

  <!-- Arrow 2: MCU to Split -->
  <path d="M 515 160 L 568 160" fill="none" stroke="#F57C00" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="542" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#F57C00" text-anchor="middle">Process</text>

  <!-- Node 3: Split Logic -->
  <g filter="url(#shadow)">
    <rect x="575" y="110" width="220" height="100" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" />
    <text x="685" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">Digit Extraction</text>
    <text x="685" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6A1B9A" text-anchor="middle">Thousands &amp; Hundreds</text>
    <text x="685" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6A1B9A" text-anchor="middle">Tens &amp; Ones</text>
    <text x="685" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7B1FA2" text-anchor="middle">(Modulo / 10 Algorithm)</text>
  </g>

  <!-- Arrow 3: Split to PORTB -->
  <path d="M 795 135 L 835 135 L 835 85 L 868 85" fill="none" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="835" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#7B1FA2" text-anchor="middle">Tens / Ones</text>

  <!-- Arrow 4: Split to PORTC -->
  <path d="M 795 185 L 835 185 L 835 235 L 868 235" fill="none" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="835" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#7B1FA2" text-anchor="middle">Thou / Hund</text>

  <!-- Node 4: PORTB -->
  <g filter="url(#shadow)">
    <rect x="875" y="40" width="235" height="90" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" />
    <text x="992" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">PORTB Output</text>
    <text x="992" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2E7D32" text-anchor="middle">Tens: Bits 7..4</text>
    <text x="992" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2E7D32" text-anchor="middle">Ones: Bits 3..0</text>
  </g>

  <!-- Node 5: PORTC -->
  <g filter="url(#shadow)">
    <rect x="875" y="190" width="235" height="90" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" />
    <text x="992" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">PORTC Output</text>
    <text x="992" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2E7D32" text-anchor="middle">Thousands: Bits 7..4</text>
    <text x="992" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2E7D32" text-anchor="middle">Hundreds: Bits 3..0</text>
  </g>
</svg>
